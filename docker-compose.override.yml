# Auto-loaded by `docker compose up` — hot-reload for dev.
# For production, run: docker compose -f docker-compose.yml up
services:
  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - app_net

  backend:
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./services/backend/src:/app/src
    environment:
      PYTHONPATH: /app/src
    command: uvicorn assistant.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

  frontend:
    build:
      context: services/frontend/
      dockerfile: Dockerfile.dev
    read_only: false
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./services/frontend/src:/app/src
