
services:
  qdrant:
    # v1.17.0-unprivileged — hardened image (non-root, minimal privileges baked in)
    image: qdrant/qdrant@sha256:8dbc4655e2fe3e8649cad26ca6040dbfe0ac75663bd67b28a639166884ae6627
    container_name: qdrant
    restart: unless-stopped
    # https://qdrant.tech/documentation/guides/security/
    # Run unprivileged inside the container
    user: "1000:1000"

    # Read-only root filesystem — only named volumes and tmpfs are writable
    read_only: true

    # Persist data & snapshots on named volumes
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
      - ./config/qdrant.yaml:/qdrant/config/production.yaml:ro
    tmpfs:
      - /qdrant/tmp:size=256m,uid=1000,gid=1000
      - /tmp:size=64m,uid=1000,gid=1000
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?}

    # Healthcheck via TCP probe
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8g
        reservations:
          cpus: "1.0"
          memory: 2g

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # Only on internal network — reachable by backend, not by frontend
    networks:
      - qdrant_net

  backend:
    init: true
    build: services/backend/
    container_name: backend
    restart: unless-stopped
    read_only: true
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_GRPC_PORT: "6334"
    tmpfs:
      - /tmp:size=128m
    depends_on:
      qdrant:
        condition: service_healthy
#    healthcheck:
#      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/ui/health\")'"]
#      interval: 10s
#      timeout: 3s
#      retries: 5
#      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app_net
      - qdrant_net

  frontend:
    build: services/frontend/
    container_name: frontend
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:3000:80"
    tmpfs:
      - /tmp:size=32m
      - /var/cache/nginx:size=64m
      - /run:size=8m
    depends_on:
#      backend:
#        condition: service_healthy
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app_net

volumes:
  qdrant_data:
    driver: local
  qdrant_snapshots:
    driver: local

networks:
  app_net:
    driver: bridge
  qdrant_net:
    driver: bridge
    internal: true