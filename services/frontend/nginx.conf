server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend through Docker's DNS; a recreated container gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Run event streams: no buffering, long-lived
    location ~ ^/api/v1/runs/[^/]+/stream$ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64k;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback; index.html is never cached so a deploy is picked up at once
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
