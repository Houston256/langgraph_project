[project]
name = "assistant"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118.0",
    "httpx>=0.28.1",
    "langchain-core>=1.0.0",
    "langchain[openai]>=0.3.27",
    "langgraph>=0.6.8",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openai>=3.27.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "qdrant-client>=1.15.1",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "bs4>=0.0.2",
    "fastapi[standard]>=0.118.0",
    "html5lib>=1.1",
    "langchain-tests>=1.0.0",
    "lxml>=6.0.2",
    "marimo>=0.17.0",
    "markdownify>=1.2.0",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.1",
    "streamlit>=1.54.0",
    "tabulate>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["db: needs the compose postgres (skipped when it isn't reachable)"]
